[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "controlgraph"
version = "0.1.0"
description = "Local SEL RTAC to Ignition lineage proof of concept"
requires-python = ">=3.10"
dependencies = [
  "anyio==4.4.0",
  "fastapi==0.111.1",
  "httpx==0.27.2",
  "starlette==0.37.2",
  "uvicorn==0.30.6",
]

[project.scripts]
controlgraph = "controlgraph.cli:main"

[tool.setuptools.packages.find]
include = ["controlgraph*"]
